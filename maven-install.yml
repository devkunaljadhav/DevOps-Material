---
- name: Install Maven
  hosts: all
  become: true

  tasks:

    - name: Install Java 17
      ansible.builtin.dnf:
        name: java-17-amazon-corretto
        state: present

    - name: Install Maven
      ansible.builtin.dnf:
        name: maven
        state: present

    - name: Check Maven version
      ansible.builtin.command:
        cmd: mvn -version
      register: maven_version
      changed_when: false

    - name: Display Maven version
      ansible.builtin.debug:
        var: maven_version.stdout_lines
