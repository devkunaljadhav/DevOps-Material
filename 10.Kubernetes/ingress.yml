Note: In below yml file change ACM ARN and host to some domain name

vi ingress.yml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: insurance-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/subnet-auto-discovery: kops-util

    # Redirect all HTTP to HTTPS
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"

    # ACM Certificate ARN for SSL
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:298713973935:certificate/fc540759-fc94-463b-a77c-d8c5a9e5dae1
    # Optional: Health check settings for ALB
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
spec:
  ingressClassName: alb
  rules:
    - host: k8s.kunalcloud.shop
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: insurance-service
                port:
                  number: 80
