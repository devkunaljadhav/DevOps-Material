Note: In below yml file change ACM ARN and host to some domain name
vi ingress.yml


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: insurance-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance

    # Explicitly specify two verified public subnets
    alb.ingress.kubernetes.io/subnets: subnet-0701152c1eb4c10ec,subnet-0e28a957b32bcdf9f

    # HTTP and HTTPS listeners
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"

    # ACM certificate in ap-south-1
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:298713973935:certificate/fc540759-fc94-463b-a77c-d8c5a9e5dae1

    # Health check
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
spec:
  ingressClassName: alb
  rules:
    - host: k8s.kunalcloud.shop
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: insurance-service
                port:
                  number: 80

